name: Deploy to GCP
run-name: "[Deploy ${{ github.event.workflow_run.event == 'pull_request' && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'base' }}] ${{ github.event.workflow_run.head_commit.message }}"

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  check_deployment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'base' ||
       github.event.workflow_run.event == 'pull_request')

    permissions:
      pull-requests: 'read'

    outputs:
      should_deploy: ${{ steps.determine.outputs.should_deploy }}
      is_base: ${{ steps.determine.outputs.is_base }}
      version: ${{ steps.determine.outputs.version }}
      promote: ${{ steps.determine.outputs.promote }}
      pull_request_number: ${{ steps.determine.outputs.pull_request_number }}

    steps:
    - id: determine
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        EVENT_NAME: ${{ github.event.workflow_run.event }}
        PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$HEAD_BRANCH" = "base" ] && [ "$EVENT_NAME" = "push" ]; then
          echo "Base branch push detected: always deploying to production."
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "is_base=true" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$PULL_REQUEST_NUMBER" ]; then
          echo "Pull request #${PULL_REQUEST_NUMBER} detected. Inspecting author..."
          PULL_REQUEST_AUTHOR=$(gh pr view "$PULL_REQUEST_NUMBER" --json author --jq .author.login -R "${{ github.repository }}")

          if [ "$PULL_REQUEST_AUTHOR" != "ronshapiro" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} author is '$PULL_REQUEST_AUTHOR' (not ronshapiro). Skipping staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Author verified as ronshapiro. Inspecting modified files..."
          CHANGED_FILES=$(gh api --paginate "repos/${{ github.repository }}/pulls/${PULL_REQUEST_NUMBER}/files" --jq '.[].filename')
          echo "Changed files in PR #${PULL_REQUEST_NUMBER}:"
          echo "$CHANGED_FILES"

          NON_IGNORED_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^(precomputed/ai_additions/|precomputed/rsi_state/)|(^|/)(test_data|__tests__)(/|$)|(^|/)\.?pre-commit|\.test\.(ts|tsx)$' | grep -v '^[[:space:]]*$' || true)

          if [ -z "$NON_IGNORED_FILES" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} only modifies ignored files (data, tests, or pre-commit) (or diff is empty)."
            echo "Skipping staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #${PULL_REQUEST_NUMBER} has modifications outside ignored paths:"
            echo "$NON_IGNORED_FILES"
            echo "Proceeding with preview deployment."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "is_base=false" >> "$GITHUB_OUTPUT"
            echo "version=pr-${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "pull_request_number=${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "Neither base push nor pull request detected. Skipping deployment."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
        fi

  gcp_deploy:
    needs: check_deployment
    if: needs.check_deployment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    # App Engine deployments run asynchronously on GCP once submitted by gcloud,
    # so cancelling an active job mid-deploy cannot safely abort the server-side
    # rollout. Serialize all deployments with queue: max so the active deploy
    # finishes first without later triggers evicting queued base or PR deploys,
    # and skip superseded commits once a run acquires the lock.
    concurrency:
      group: ${{ needs.check_deployment.outputs.should_deploy == 'true' && 'deploy-gcp' || format('deploy-gcp-skip-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max

    permissions:
      actions: 'read'
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'

    steps:
    - id: check-superseded
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        IS_BASE: ${{ needs.check_deployment.outputs.is_base }}
        PULL_REQUEST_NUMBER: ${{ needs.check_deployment.outputs.pull_request_number }}
        WORKFLOW_RUN_HEAD_COMMIT: ${{ github.event.workflow_run.head_sha }}
      run: |
        if [ "$IS_BASE" = "true" ]; then
          BASE_HEAD_COMMIT=$(gh api "repos/${{ github.repository }}/git/ref/heads/base" --jq '.object.sha')
          if [ "$WORKFLOW_RUN_HEAD_COMMIT" = "$BASE_HEAD_COMMIT" ]; then
            echo "Commit ${WORKFLOW_RUN_HEAD_COMMIT} is the latest commit on base."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMPARISON_LINES=$(gh api "repos/${{ github.repository }}/compare/${WORKFLOW_RUN_HEAD_COMMIT}...base" \
            --jq '.status, .commits[].sha')
          COMPARISON_STATUS=$(echo "$COMPARISON_LINES" | head -n 1)
          NEWER_COMMITS=$(echo "$COMPARISON_LINES" | tail -n +2)

          if [ "$COMPARISON_STATUS" = "identical" ]; then
            echo "Commit ${WORKFLOW_RUN_HEAD_COMMIT} is the latest commit on base."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$COMPARISON_STATUS" != "ahead" ]; then
            echo "Commit ${WORKFLOW_RUN_HEAD_COMMIT} is no longer an ancestor of base (status=${COMPARISON_STATUS}). Skipping deployment."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PASSING_TEST_COMMITS=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?branch=base&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha')

          SUPERSEDING_COMMIT=""
          if echo "$PASSING_TEST_COMMITS" | grep -Fxq "$BASE_HEAD_COMMIT"; then
            SUPERSEDING_COMMIT="$BASE_HEAD_COMMIT"
          else
            while IFS= read -r candidate_commit; do
              if [ -n "$candidate_commit" ] && echo "$PASSING_TEST_COMMITS" | grep -Fxq "$candidate_commit"; then
                SUPERSEDING_COMMIT="$candidate_commit"
              fi
            done <<< "$NEWER_COMMITS"
          fi

          if [ -n "$SUPERSEDING_COMMIT" ]; then
            echo "Commit ${WORKFLOW_RUN_HEAD_COMMIT} is superseded by newer passing base commit ${SUPERSEDING_COMMIT}. Skipping deployment."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "Newer commits exist on base, but none have passed Tests yet. Proceeding with deployment of ${WORKFLOW_RUN_HEAD_COMMIT}."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
        else
          PULL_REQUEST_LINES=$(gh pr view "$PULL_REQUEST_NUMBER" --json state,headRefOid --jq '.state, .headRefOid' -R "${{ github.repository }}")
          PULL_REQUEST_STATE=$(echo "$PULL_REQUEST_LINES" | head -n 1)
          PULL_REQUEST_HEAD_COMMIT=$(echo "$PULL_REQUEST_LINES" | tail -n +2)

          if [ "$PULL_REQUEST_STATE" != "OPEN" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} is ${PULL_REQUEST_STATE}. Skipping preview deployment."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          elif [ "$PULL_REQUEST_HEAD_COMMIT" != "$WORKFLOW_RUN_HEAD_COMMIT" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} commit ${WORKFLOW_RUN_HEAD_COMMIT} is superseded by ${PULL_REQUEST_HEAD_COMMIT}. Skipping preview deployment."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR #${PULL_REQUEST_NUMBER} commit ${WORKFLOW_RUN_HEAD_COMMIT} is still the latest open PR head. Proceeding with preview deployment."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
        fi

    - if: steps.check-superseded.outputs.superseded != 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}

    - if: steps.check-superseded.outputs.superseded != 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - if: steps.check-superseded.outputs.superseded != 'true'
      run: 'npm install --no-audit'

    - id: configure-secrets
      if: steps.check-superseded.outputs.superseded != 'true'
      env:
        MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
        MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
        IGNORE_EMAIL_ADDRESSES: ${{ secrets.IGNORE_EMAIL_ADDRESSES }}
        RSI_REVIEW_KEY: ${{ secrets.RSI_REVIEW_KEY }}
        CREATE_ISSUE_ACCESS_TOKEN: ${{ secrets.CREATE_ISSUE_ACCESS_TOKEN }}
      run: |
        echo -n "${MAILJET_API_KEY}" > mailjet_api_key
        echo -n "${MAILJET_API_SECRET}" > mailjet_api_secret
        echo -n "${IGNORE_EMAIL_ADDRESSES}" > ignore_email_addresses
        echo "" >> app.yaml
        echo "env_variables:" >> app.yaml
        echo "  RSI_REVIEW_KEY: '${RSI_REVIEW_KEY}'" >> app.yaml
        echo "  CREATE_ISSUE_ACCESS_TOKEN: '${CREATE_ISSUE_ACCESS_TOKEN}'" >> app.yaml

    - id: 'build'
      if: steps.check-superseded.outputs.superseded != 'true'
      run: 'npm run parcel-prod'

    - id: 'auth'
      if: steps.check-superseded.outputs.superseded != 'true'
      # Note: make sure that the roles are configured in the IAM tab and not under the
      # Service Accounts > Permissions page. This is confusing!
      uses: 'google-github-actions/auth@v2'
      env:
        GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      with:
        project_id: 'talmud'
        credentials_json: '${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}'

    - id: 'verify-gcloud'
      if: steps.check-superseded.outputs.superseded != 'true'
      run: 'gcloud --version'

    - id: 'verify-auth'
      if: steps.check-superseded.outputs.superseded != 'true'
      run: 'gcloud auth list'

    - id: 'deploy'
      if: steps.check-superseded.outputs.superseded != 'true'
      uses: 'google-github-actions/deploy-appengine@v2'
      with:
        version: ${{ needs.check_deployment.outputs.version }}
        promote: ${{ needs.check_deployment.outputs.promote == 'true' }}

    - name: Comment Preview URL on PR
      if: steps.check-superseded.outputs.superseded != 'true' && needs.check_deployment.outputs.is_base == 'false'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PULL_REQUEST_NUMBER: ${{ needs.check_deployment.outputs.pull_request_number }}
        PREVIEW_URL: ${{ steps.deploy.outputs.version_url || format('https://{0}-dot-talmud.appspot.com', needs.check_deployment.outputs.version) }}
      run: |
        COMMENT_IDENTIFIER=$(gh api "repos/${{ github.repository }}/issues/${PULL_REQUEST_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("<!-- pr-preview-deployment -->")) | .id' | head -n 1)

        if [ -n "$COMMENT_IDENTIFIER" ]; then
          REDEPLOYMENT_COMMENT_BODY=$(printf '🚀 New deployment has completed:\n%s\n' "$PREVIEW_URL")
          gh pr comment "$PULL_REQUEST_NUMBER" --body "$REDEPLOYMENT_COMMENT_BODY"
        else
          INITIAL_COMMENT_BODY=$(printf '<!-- pr-preview-deployment -->\n🚀 Deployed preview to App Engine:\n%s\n' "$PREVIEW_URL")
          gh pr comment "$PULL_REQUEST_NUMBER" --body "$INITIAL_COMMENT_BODY"
        fi
