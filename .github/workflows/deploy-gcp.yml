name: Deploy to GCP
run-name: "[Deploy ${{ github.event.workflow_run.event == 'pull_request' && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'base' }}] ${{ github.event.workflow_run.head_commit.message }}"

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  gcp_deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'base' ||
       github.event.workflow_run.event == 'pull_request')

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
      issues: 'write'

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}

    - id: determine-deployment
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        EVENT: ${{ github.event.workflow_run.event }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      run: |
        if [ "$HEAD_BRANCH" = "base" ] && [ "$EVENT" = "push" ]; then
          echo "is_base=true" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$PR_NUMBER" ]; then
          echo "is_base=false" >> "$GITHUB_OUTPUT"
          echo "version=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "promote=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        else
          echo "Skipping deployment: neither push to base nor pull request with number found."
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - run: 'npm install --no-audit'

    - id: configure-secrets
      env:
        MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
        MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
        IGNORE_EMAIL_ADDRESSES: ${{ secrets.IGNORE_EMAIL_ADDRESSES }}
        RSI_REVIEW_KEY: ${{ secrets.RSI_REVIEW_KEY }}
        CREATE_ISSUE_ACCESS_TOKEN: ${{ secrets.CREATE_ISSUE_ACCESS_TOKEN }}
      run: |
        echo -n "${MAILJET_API_KEY}" > mailjet_api_key
        echo -n "${MAILJET_API_SECRET}" > mailjet_api_secret
        echo -n "${IGNORE_EMAIL_ADDRESSES}" > ignore_email_addresses
        echo "" >> app.yaml
        echo "env_variables:" >> app.yaml
        echo "  RSI_REVIEW_KEY: '${RSI_REVIEW_KEY}'" >> app.yaml
        echo "  CREATE_ISSUE_ACCESS_TOKEN: '${CREATE_ISSUE_ACCESS_TOKEN}'" >> app.yaml

    - id: 'build'
      run: 'npm run parcel-prod'

    - id: 'auth'
      # Note: make sure that the roles are configured in the IAM tab and not under the
      # Service Accounts > Permissions page. This is confusing!
      uses: 'google-github-actions/auth@v2'
      env:
        GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      with:
        project_id: 'talmud'
        credentials_json: '${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}'

    - id: 'verify-gcloud'
      run: 'gcloud --version'

    - id: 'verify-auth'
      run: 'gcloud auth list'

    - id: 'deploy'
      uses: 'google-github-actions/deploy-appengine@v2'
      with:
        version: ${{ steps.determine-deployment.outputs.version }}
        promote: ${{ steps.determine-deployment.outputs.promote }}

    - name: Comment Preview URL on PR
      if: steps.determine-deployment.outputs.is_base == 'false'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ steps.determine-deployment.outputs.pr_number }}
        PREVIEW_URL: ${{ steps.deploy.outputs.version_url || format('https://{0}-dot-talmud.appspot.com', steps.determine-deployment.outputs.version) }}
      run: |
        COMMENT_BODY="<!-- pr-preview-deployment -->
        🚀 Deployed preview to App Engine:
        ${PREVIEW_URL}"

        COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("<!-- pr-preview-deployment -->")) | .id' | head -n 1)

        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$COMMENT_BODY"
        else
          gh pr comment "$PR_NUMBER" --body "$COMMENT_BODY"
        fi
