name: Deploy to GCP
run-name: "[Deploy ${{ github.event.workflow_run.event == 'pull_request' && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'base' }}] ${{ github.event.workflow_run.head_commit.message }}"

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  check_deployment:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'base' ||
       github.event.workflow_run.event == 'pull_request')

    permissions:
      pull-requests: 'read'

    outputs:
      should_deploy: ${{ steps.determine.outputs.should_deploy }}
      is_base: ${{ steps.determine.outputs.is_base }}
      version: ${{ steps.determine.outputs.version }}
      promote: ${{ steps.determine.outputs.promote }}
      pull_request_number: ${{ steps.determine.outputs.pull_request_number }}

    steps:
    - id: determine
      env:
        HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        EVENT_NAME: ${{ github.event.workflow_run.event }}
        PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$HEAD_BRANCH" = "base" ] && [ "$EVENT_NAME" = "push" ]; then
          echo "Base branch push detected: always deploying to production."
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "is_base=true" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "promote=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$PULL_REQUEST_NUMBER" ]; then
          echo "Pull request #${PULL_REQUEST_NUMBER} detected. Inspecting author..."
          PULL_REQUEST_AUTHOR=$(gh pr view "$PULL_REQUEST_NUMBER" --json author --jq .author.login -R "${{ github.repository }}")

          if [ "$PULL_REQUEST_AUTHOR" != "ronshapiro" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} author is '$PULL_REQUEST_AUTHOR' (not ronshapiro). Skipping staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Author verified as ronshapiro. Inspecting modified files..."
          CHANGED_FILES=$(gh pr diff "$PULL_REQUEST_NUMBER" --name-only -R "${{ github.repository }}")
          echo "Changed files in PR #${PULL_REQUEST_NUMBER}:"
          echo "$CHANGED_FILES"

          NON_IGNORED_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^(precomputed/ai_additions/|precomputed/rsi_state/)' | grep -v '^[[:space:]]*$' || true)

          if [ -z "$NON_IGNORED_FILES" ]; then
            echo "PR #${PULL_REQUEST_NUMBER} only modifies files in precomputed/ai_additions/ or precomputed/rsi_state/ (or diff is empty)."
            echo "Skipping staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "PR #${PULL_REQUEST_NUMBER} has modifications outside ignored paths:"
            echo "$NON_IGNORED_FILES"
            echo "Proceeding with preview deployment."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "is_base=false" >> "$GITHUB_OUTPUT"
            echo "version=pr-${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "pull_request_number=${PULL_REQUEST_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "Neither base push nor pull request detected. Skipping deployment."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"
        fi

  gcp_deploy:
    needs: check_deployment
    if: needs.check_deployment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'read'

    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.workflow_run.head_repository.full_name }}
        ref: ${{ github.event.workflow_run.head_sha }}

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - run: 'npm install --no-audit'

    - id: configure-secrets
      env:
        MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
        MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
        IGNORE_EMAIL_ADDRESSES: ${{ secrets.IGNORE_EMAIL_ADDRESSES }}
        RSI_REVIEW_KEY: ${{ secrets.RSI_REVIEW_KEY }}
        CREATE_ISSUE_ACCESS_TOKEN: ${{ secrets.CREATE_ISSUE_ACCESS_TOKEN }}
      run: |
        echo -n "${MAILJET_API_KEY}" > mailjet_api_key
        echo -n "${MAILJET_API_SECRET}" > mailjet_api_secret
        echo -n "${IGNORE_EMAIL_ADDRESSES}" > ignore_email_addresses
        echo "" >> app.yaml
        echo "env_variables:" >> app.yaml
        echo "  RSI_REVIEW_KEY: '${RSI_REVIEW_KEY}'" >> app.yaml
        echo "  CREATE_ISSUE_ACCESS_TOKEN: '${CREATE_ISSUE_ACCESS_TOKEN}'" >> app.yaml

    - id: 'build'
      run: 'npm run parcel-prod'

    - id: 'auth'
      # Note: make sure that the roles are configured in the IAM tab and not under the
      # Service Accounts > Permissions page. This is confusing!
      uses: 'google-github-actions/auth@v2'
      env:
        GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      with:
        project_id: 'talmud'
        credentials_json: '${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}'

    - id: 'verify-gcloud'
      run: 'gcloud --version'

    - id: 'verify-auth'
      run: 'gcloud auth list'

    - id: 'deploy'
      uses: 'google-github-actions/deploy-appengine@v2'
      with:
        version: ${{ needs.check_deployment.outputs.version }}
        promote: ${{ needs.check_deployment.outputs.promote == 'true' }}

    - name: Comment Preview URL on PR
      if: needs.check_deployment.outputs.is_base == 'false'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PULL_REQUEST_NUMBER: ${{ needs.check_deployment.outputs.pull_request_number }}
        PREVIEW_URL: ${{ steps.deploy.outputs.version_url || format('https://{0}-dot-talmud.appspot.com', needs.check_deployment.outputs.version) }}
      run: |
        COMMENT_BODY="<!-- pr-preview-deployment -->
        🚀 Deployed preview to App Engine:
        ${PREVIEW_URL}"

        COMMENT_IDENTIFIER=$(gh api "repos/${{ github.repository }}/issues/${PULL_REQUEST_NUMBER}/comments" \
          --jq '.[] | select(.body | contains("<!-- pr-preview-deployment -->")) | .id' | head -n 1)

        if [ -n "$COMMENT_IDENTIFIER" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_IDENTIFIER}" -f body="$COMMENT_BODY"
        else
          gh pr comment "$PULL_REQUEST_NUMBER" --body "$COMMENT_BODY"
        fi
