<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
      }
    </script>

    <style>
      @keyframes bounce-in {
          0% { transform: translateY(100%); opacity: 0; }
          60% { transform: translateY(-10%); opacity: 1; }
          100% { transform: translateY(0); }
      }
      .animate-bounce-in {
          animation: bounce-in 0.3s ease-out forwards;
      }
    </style>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useCallback } from 'react';
      import { createRoot } from 'react-dom/client';
      import { Trash2, Plus, Save, RefreshCw, Copy, Search, X, Check, Database } from 'lucide-react';

      const LocalStorageManager = () => {
        const [items, setItems] = useState([]);

        const [filter, setFilter] = useState(() => {
          if (typeof window !== 'undefined') {
            const params = new URLSearchParams(window.location.search);
            return params.get('filter') || '';
          }
          return '';
        });

        const [newItem, setNewItem] = useState({ key: '', value: '' });
        const [editingKey, setEditingKey] = useState(null);
        const [editValue, setEditValue] = useState('');
        const [notification, setNotification] = useState(null);

        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          if (filter) {
            params.set('filter', filter);
          } else {
            params.delete('filter');
          }
          const queryString = params.toString();
          const newUrl = queryString
            ? `${window.location.pathname}?${queryString}`
            : window.location.pathname;
          window.history.replaceState(null, '', newUrl);
        }, [filter]);

        // Helper to show temporary notifications
        const showNotification = (message, type = 'success') => {
          setNotification({ message, type });
          setTimeout(() => setNotification(null), 3000);
        };

        // specific function to read all storage items
        const loadStorage = useCallback(() => {
          try {
            const storageItems = [];
            for (let i = 0; i < localStorage.length; i++) {
              const key = localStorage.key(i);
              const value = localStorage.getItem(key);
              storageItems.push({ key, value });
            }
            // Sort by key for consistent display
            storageItems.sort((a, b) => a.key.localeCompare(b.key));
            setItems(storageItems);
          } catch (e) {
            console.error("Could not access localStorage", e);
            showNotification("Error accessing localStorage. Check permissions.", "error");
          }
        }, []);

        // Initial load and event listener for storage changes (cross-tab)
        useEffect(() => {
          loadStorage();

          // Listen for changes from other tabs
          window.addEventListener('storage', loadStorage);

          // Optional: Poll slightly to catch changes made by devtools or other scripts in the same tab
          // since 'storage' event doesn't fire for the same window.
          const interval = setInterval(() => {
            // This is a naive check to see if count changed, but deep checking is expensive.
            // We'll rely mostly on manual actions triggering re-renders, but this helps.
            if (localStorage.length !== items.length) {
              loadStorage();
            }
          }, 2000);

          return () => {
            window.removeEventListener('storage', loadStorage);
            clearInterval(interval);
          };
        }, [items.length, loadStorage]);

        const handleAddItem = (e) => {
          e.preventDefault();
          if (!newItem.key.trim()) {
            showNotification("Key cannot be empty", "error");
            return;
          }
          if (localStorage.getItem(newItem.key) !== null) {
            if (!window.confirm(`Key "${newItem.key}" already exists. Overwrite?`)) {
              return;
            }
          }

          try {
            localStorage.setItem(newItem.key, newItem.value);
            setNewItem({ key: '', value: '' });
            loadStorage();
            showNotification("Item added successfully");
          } catch (e) {
            showNotification("Failed to save. Storage might be full.", "error");
          }
        };

        const handleDelete = (key) => {
          if (window.confirm(`Are you sure you want to delete "${key}"?`)) {
            localStorage.removeItem(key);
            loadStorage();
            showNotification("Item deleted");
          }
        };

        const handleClearAll = () => {
          if (window.confirm("Are you sure you want to delete ALL localStorage items? This cannot be undone.")) {
            localStorage.clear();
            loadStorage();
            showNotification("All items cleared");
          }
        };

        const startEditing = (item) => {
          setEditingKey(item.key);
          setEditValue(item.value);
        };

        const saveEdit = (key) => {
          try {
            localStorage.setItem(key, editValue);
            setEditingKey(null);
            loadStorage();
            showNotification("Value updated");
          } catch (e) {
            showNotification("Failed to save update.", "error");
          }
        };

        const cancelEdit = () => {
          setEditingKey(null);
          setEditValue('');
        };

        const copyToClipboard = (text) => {
          // Fallback for iframe environments if navigator.clipboard fails
          try {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showNotification("Copied to clipboard");
          } catch (err) {
            showNotification("Failed to copy", "error");
          }
        };

        // Filter items based on search
        const filteredItems = items.filter(item =>
          item.key.toLowerCase().includes(filter.toLowerCase()) ||
            item.value.toLowerCase().includes(filter.toLowerCase())
        );

        return (
            <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">

          {/* Header */}
            <div className="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div className="flex items-center gap-3">
            <div className="p-3 bg-blue-600 rounded-xl shadow-lg shadow-blue-200">
            <Database className="text-white w-6 h-6" />
            </div>
            <div>
            <h1 className="text-2xl font-bold text-slate-900">Storage Manager</h1>
            <p className="text-slate-500 text-sm">Manage localStorage for {window.location.hostname || 'current page'}</p>
            </div>
            </div>

            <div className="flex items-center gap-2">
            <button
          onClick={loadStorage}
          className="p-2 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"
          title="Refresh List"
            >
            <RefreshCw className="w-5 h-5" />
            </button>
            <button
          onClick={handleClearAll}
          className="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-sm font-medium transition-colors"
            >
            <Trash2 className="w-4 h-4" />
            Clear All
          </button>
            </div>
            </div>

          {/* Main Content */}
            <div className="max-w-6xl mx-auto grid gap-6 lg:grid-cols-3">

          {/* Left Column: Add New & Stats */}
            <div className="space-y-6">
            {/* Add New Card */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div className="p-4 border-b border-slate-100 bg-slate-50/50">
            <h2 className="font-semibold text-slate-800 flex items-center gap-2">
            <Plus className="w-4 h-4 text-blue-500" />
            Add New Item
          </h2>
            </div>
            <form onSubmit={handleAddItem} className="p-4 space-y-4">
            <div>
            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Key</label>
            <input
          type="text"
          value={newItem.key}
          onChange={(e) => setNewItem({...newItem, key: e.target.value})}
          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
          placeholder="e.g., userSettings"
            />
            </div>
            <div>
            <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Value</label>
            <textarea
          value={newItem.value}
          onChange={(e) => setNewItem({...newItem, value: e.target.value})}
          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm h-32 font-mono text-xs"
          placeholder="Value..."
            />
            </div>
            <h2 className="font-semibold text-slate-800 flex items-center gap-2">

            <button
          type="submit"
          className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg font-medium text-sm transition-colors shadow-lg shadow-slate-200 active:transform active:scale-95"
            >
            <span>Add</span>
          </button>
          </h2>

            </form>
            </div>

          {/* Stats Card */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4">Storage Stats</h3>
            <div className="grid grid-cols-2 gap-4">
            <div className="p-3 bg-blue-50 rounded-xl">
            <div className="text-2xl font-bold text-blue-600">{items.length}</div>
            <div className="text-xs text-blue-600/70 font-medium">Total Items</div>
            </div>
            <div className="p-3 bg-emerald-50 rounded-xl">
            <div className="text-2xl font-bold text-emerald-600">
            {new Blob([JSON.stringify(items)]).size > 1024
              ? (new Blob([JSON.stringify(items)]).size / 1024).toFixed(1) + ' KB'
              : new Blob([JSON.stringify(items)]).size + ' B'}
          </div>
            <div className="text-xs text-emerald-600/70 font-medium">Approx Size</div>
            </div>
            </div>
            </div>
            </div>

          {/* Right Column: List */}
            <div className="lg:col-span-2 space-y-4">

          {/* Search Bar */}
            <div className="relative">
            <Search className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
            <input
          type="text"
          placeholder="Filter keys or values..."
          value={filter}
          onChange={(e) => setFilter(e.target.value)}
          className="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm"
            />
            </div>

          {/* List */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden min-h-[400px]">
            {filteredItems.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-64 text-slate-400">
                <Database className="w-12 h-12 mb-3 opacity-20" />
                <p>No items found</p>
                </div>
            ) : (
                <div className="divide-y divide-slate-100">
                {filteredItems.map((item) => (
                    <div key={item.key} className="p-4 hover:bg-slate-50 transition-colors group">
                    <div className="flex items-start justify-between gap-4 mb-2">
                    <div className="flex items-center gap-2 min-w-0">
                    <span className="bg-slate-100 text-slate-600 text-xs font-mono px-2 py-1 rounded border border-slate-200 truncate max-w-[200px]" title={item.key}>
                    {item.key}
                  </span>
                    <button
                  onClick={() => copyToClipboard(item.key)}
                  className="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-blue-500 transition-opacity p-1"
                  title="Copy Key"
                    >
                    <Copy className="w-3 h-3" />
                    </button>
                    </div>

                    <div className="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    {editingKey === item.key ? (
                        <>
                        <button
                      onClick={() => saveEdit(item.key)}
                      className="p-1.5 bg-blue-100 text-blue-600 rounded-md hover:bg-blue-200 transition-colors"
                      title="Save"
                        >
                        <Check className="w-4 h-4" />
                        </button>
                        <button
                      onClick={cancelEdit}
                      className="p-1.5 bg-slate-100 text-slate-600 rounded-md hover:bg-slate-200 transition-colors"
                      title="Cancel"
                        >
                        <X className="w-4 h-4" />
                        </button>
                        </>
                    ) : (
                        <button
                      onClick={() => handleDelete(item.key)}
                      className="p-1.5 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-md transition-colors"
                      title="Delete"
                        >
                        <Trash2 className="w-4 h-4" />
                        </button>
                    )}
                  </div>
                    </div>

                    <div className="relative">
                    {editingKey === item.key ? (
                        <textarea
                      value={editValue}
                      onChange={(e) => setEditValue(e.target.value)}
                      className="w-full p-3 bg-white border border-blue-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-4 focus:ring-blue-500/10 min-h-[100px]"
                      autoFocus
                        />
                    ) : (
                        <div
                      onClick={() => startEditing(item)}
                      className="w-full text-sm text-slate-600 break-all cursor-pointer hover:text-slate-900 border border-transparent hover:border-slate-200 rounded-lg p-2 -ml-2 transition-all"
                        >
                        {/* Truncate incredibly long values for display, full edit on click */}
                      {item.value.length > 300 ? (
                          <>
                          <span className="font-mono text-xs">{item.value.substring(0, 300)}</span>
                          <span className="text-blue-500 text-xs ml-1 font-medium bg-blue-50 px-1 rounded">...Show More (Click to Edit)</span>
                          </>
                      ) : (
                          <span className="font-mono text-xs whitespace-pre-wrap">{item.value}</span>
                      )}
                      </div>
                    )}
                  </div>
                    </div>
                ))}
              </div>
            )}
          </div>
            </div>
            </div>

          {/* Notification Toast */}
          {notification && (
              <div className={`fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-2xl border flex items-center gap-3 animate-bounce-in z-50 ${
                    notification.type === 'error'
                        ? 'bg-red-50 border-red-100 text-red-700'
                        : 'bg-slate-900 border-slate-800 text-white'
              }`}>
              {notification.type === 'success' ? <Check className="w-4 h-4" /> : <X className="w-4 h-4" />}
              <span className="font-medium text-sm">{notification.message}</span>
              </div>
          )}
          </div>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<LocalStorageManager />);
    </script>
  </body>
</html>
